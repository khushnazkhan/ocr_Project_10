version: "3.8"
services:
  ocr-app:
    build: .
    image: custom-ocr:latest
    container_name: custom_ocr_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
      - ./results:/app/results
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
